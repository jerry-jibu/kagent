# evaluator 的 kagent harness（kagent 类型一等 harness；env.md 集群同款）。
# 0002 曾写 HarnessRef(kagent-default)——那是 1.0.1 onboarding 内置，本集群
# v1.0.0-rc3 需显式 CR（文档漂移随 PR 修复批次记录）。
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent-harness
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: superagent-on-kagent
spec:
  kagent: {}
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
