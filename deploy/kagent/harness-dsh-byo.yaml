# Harness: DSH BYO（0002 §1-A2/D7）——零 CRD 扩展，digest 钉死镜像 + 固定 command
# 镜像源: kagent-dev/byo-ext PR #2（未合入 main），源基线 pr-2 @ 8632d5e
#   （19771c8 为旧 env 契约基线；现网已是 bootstrap 契约——0002 A4）
#   构建: 仓库外配方 kagent-dev/.superagent-notes/build/Dockerfile.dsh
#   （--target production，CN 源+vendor；完整步骤见 README 构建节）——
#   钉死 digest 不对应分支直接构建，按台账"源 SHA + 构建配方"双记录
#   （风险表：显式重同步，不自动漂移）
# 占位符用 envsubst 代入后 apply（见 README.md）
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: dsh-byo
  namespace: kagent
spec:
  byo: {}
  workload:
    # CEL 强制 digest 钉死: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ (harness_types.go:116-118)
    image: ${DSH_BYO_IMAGE}   # 例: registry.example.com/kagent-dsh-byo@sha256:<64hex>
    command: [/usr/local/bin/kagent-dsh-byo]
  # 字段名依据 runtime_types.go:33-41（评审 IR-2）
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: ${SNAPSHOT_LOCATION}   # 按集群现状填：与既有 Harness 的快照位置约定一致
  # Spec.Env P0 置空——bridge 沙箱零凭证（1006），模型凭证走 egress 注入
